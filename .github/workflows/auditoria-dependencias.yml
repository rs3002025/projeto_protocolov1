name: Auditoria de dependências fixadas

on:
  push:
    branches: [main, development, codex/visual-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilidades:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Preparar auditor
        run: python -m pip install pip-audit
      - name: Consultar vulnerabilidades do manifesto aprovado
        run: pip-audit --disable-pip --no-deps -r requirements-hashes.lock --format json --output auditoria-dependencias.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar bibliotecas do navegador sem scripts de terceiros
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Auditar dependências do navegador
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Preservar relatório mesmo quando houver vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias-${{ github.run_id }}
          path: auditoria-dependencias.json
          if-no-files-found: warn

