name: Conferência visual do requerimento
on:
  push:
    branches: [codex/visual-development]
    paths: [templates/pdf_template.html, scripts/qa_pdf_layout.py, .github/workflows/pdf-layout-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils fonts-liberation
      - run: pip install -r requirements.txt
      - run: python scripts/qa_pdf_layout.py
      - run: for file in tmp/pdf-layout-review/*.pdf; do pdftoppm -scale-to 1400 -png "$file" "${file%.pdf}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: conferencia-requerimento
          path: tmp/pdf-layout-review/
