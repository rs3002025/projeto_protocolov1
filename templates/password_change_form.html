<main class="container" style="max-width:500px"><h1 class="h3">{{ 'Troque sua senha inicial' if current_user.deve_trocar_senha else 'Alterar senha' }}</h1><p>Escolha uma senha pessoal com pelo menos 8 caracteres{% if current_user.tipo == 'requerente' %}, letras maiúsculas, minúsculas e um número{% endif %}.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label d-block">Senha atual<input class="form-control" type="password" name="senha_atual" required></label><label class="form-label d-block">Nova senha<input class="form-control" type="password" name="senha_nova" autocomplete="new-password" maxlength="128" minlength="8" required></label><label class="form-label d-block">Repita a nova senha<input class="form-control" type="password" name="confirmar_senha" minlength="8" required></label><button class="btn btn-primary" type="submit">Salvar nova senha</button></form></main>
