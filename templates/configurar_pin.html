{% extends "layout.html" %}{% block content %}<main class="container" style="max-width:500px"><h1 class="h3">PIN pessoal de emissão</h1><p>Use seis números para confirmar a emissão de requerimentos. O e-mail não será necessário durante o atendimento.</p>{% if current_user.pin_hash %}<form method="post" action="{{ url_for('solicitar_redefinicao_pin') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-outline-secondary mb-3" type="submit">Receber código para redefinir PIN</button></form>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if current_user.pin_hash %}<label class="form-label d-block">Código recebido por e-mail<input class="form-control" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>{% else %}<label class="form-label d-block">Confirme sua senha<input class="form-control" name="senha" type="password" required></label>{% endif %}<label class="form-label d-block">Novo PIN de seis números<input class="form-control" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="new-password" required></label><button class="btn btn-primary" type="submit">Salvar PIN</button></form></main>{% endblock %}
