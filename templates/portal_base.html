<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Portal do Servidor' }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f7f6;color:#172321}.portal-nav{background:#063f3b;color:#fff}.portal-logo{max-width:220px;max-height:58px;object-fit:contain}.portal-shell{max-width:1050px;margin:auto}.card{border:0;box-shadow:0 4px 18px #082c2714}.btn-primary{background:#08766b;border-color:#08766b}</style></head><body><header class="portal-nav py-3"><div class="portal-shell px-3 d-flex justify-content-between align-items-center"><a href="{{ url_for('portal_home') }}" class="text-white text-decoration-none d-flex align-items-center gap-3"><img class="portal-logo bg-white rounded p-1" src="{{ url_for('organization_logo', slug=organizacao.slug) }}" alt="Logo de {{ organizacao.nome }}"><strong>Portal do Servidor</strong></a>{% if current_user.is_authenticated %}<div class="d-flex gap-2"><a class="btn btn-sm btn-outline-light" href="{{ url_for('portal_sessoes') }}">Acessos</a><form method="post" action="{{ url_for('portal_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-light">Sair</button></form></div>{% endif %}</div></header><main class="portal-shell p-3 py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block portal_content %}{% endblock %}</main></body></html>
