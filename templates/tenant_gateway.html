<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acesso — {{ organizacao.nome }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width:760px">
    <div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5 text-center">
      <img src="{{ url_for('organization_logo', slug=organizacao.slug) }}" alt="Logo de {{ organizacao.nome }}" style="max-width:280px;max-height:120px;object-fit:contain" class="mb-3">
      <h1 class="h3">{{ organizacao.nome }}</h1>
      <p class="text-muted">Escolha a área que deseja acessar.</p>
      <div class="d-grid gap-3 mt-4">
        {% if organizacao.portal_servidor_remoto_enabled %}
        <a class="btn btn-primary btn-lg" href="{{ tenant_entry_url('portal_login', organizacao) }}">Portal do Servidor</a>
        {% endif %}
        <a class="btn btn-outline-primary btn-lg" href="{{ tenant_entry_url('tenant_login', organizacao) }}">Equipe da Prefeitura</a>
      </div>
    </div></div>
  </main>
</body>
</html>
