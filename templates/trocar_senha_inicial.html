{% extends "layout.html" %}{% block content %}<main class="container" style="max-width:500px"><h1 class="h3">Troque sua senha inicial</h1><p>Antes de usar o sistema, escolha uma senha pessoal com pelo menos 12 caracteres.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label d-block">Senha inicial<input class="form-control" type="password" name="senha_atual" required></label><label class="form-label d-block">Nova senha<input class="form-control" type="password" name="senha_nova" minlength="12" required></label><label class="form-label d-block">Repita a nova senha<input class="form-control" type="password" name="confirmar_senha" minlength="12" required></label><button class="btn btn-primary" type="submit">Salvar nova senha</button></form></main>{% endblock %}
