<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro — Portal do Servidor</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4" style="max-width:700px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">Cadastre-se no Portal do Servidor</h1><p class="text-muted">{{ organizacao.nome }}</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Matrícula<input class="form-control" name="matricula" required maxlength="80"></label></div>
<div class="col-md-6"><label class="form-label">Nome completo<input class="form-control" name="nome" required></label></div>
<div class="col-md-6"><label class="form-label">CPF<input class="form-control" name="cpf" inputmode="numeric" required></label></div>
<div class="col-md-6"><label class="form-label">Primeiro nome da mãe<input class="form-control" name="primeiro_nome_mae" required></label></div>
<div class="col-md-6"><label class="form-label">Ano de nascimento<input class="form-control" name="ano_nascimento" inputmode="numeric" pattern="[0-9]{4}" required></label></div>
<div class="col-md-6"><label class="form-label">Celular<input class="form-control" name="telefone" type="tel" required></label></div>
<div class="col-12"><label class="form-label">E-mail<input class="form-control" name="email" type="email" required></label></div>
<div class="col-12"><label class="form-label">Endereço<input class="form-control" name="endereco" required></label></div>
<div class="col-12"><label class="form-label">Crie uma senha com pelo menos 12 caracteres<input class="form-control" name="senha" type="password" minlength="12" autocomplete="new-password" required></label></div>
</div><button class="btn btn-primary mt-3" type="submit">Receber código por e-mail</button></form><a class="d-block mt-3" href="{{ url_for('portal_login', slug=organizacao.slug) }}">Voltar ao login</a></div></div></main></body></html>
